name: Build

on:
  push:
    branches: [main, master]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.13'

      - name: Generate Gradle wrapper
        run: gradle wrapper --gradle-version 8.13

      # APK de depuracion: solo para instalar a mano en moviles de prueba
      - name: Build debug APK
        run: ./gradlew assembleDebug --no-daemon

      - name: Upload lint report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nsk-android-lint
          path: app/build/reports/lint-results-*.html
          if-no-files-found: ignore
          retention-days: 30

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: nsk-android-debug
          path: app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30

      # AAB firmado: esto es lo que se sube a Google Play.
      # Solo se compila si el secreto ANDROID_KEYSTORE_BASE64 esta configurado
      # en el repositorio (Settings - Secrets and variables - Actions).
      - name: Check signing secrets
        id: signing
        run: |
          if [ -n "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" ]; then
            echo "available=true" >> $GITHUB_OUTPUT
          else
            echo "available=false" >> $GITHUB_OUTPUT
            echo "::warning::Sin ANDROID_KEYSTORE_BASE64: no se genera el AAB firmado para Google Play."
          fi

      - name: Decode keystore
        if: steps.signing.outputs.available == 'true'
        run: |
          echo "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" | base64 -d > "$RUNNER_TEMP/nsk-release.jks"

      - name: Build signed release bundle (AAB)
        if: steps.signing.outputs.available == 'true'
        env:
          NSK_KEYSTORE_PATH: ${{ runner.temp }}/nsk-release.jks
          NSK_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          NSK_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          NSK_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: ./gradlew bundleRelease --no-daemon

      - name: Verify the bundle is signed
        if: steps.signing.outputs.available == 'true'
        run: |
          AAB=app/build/outputs/bundle/release/app-release.aab
          test -f "$AAB" || { echo "::error::No se genero el AAB."; exit 1; }
          if unzip -l "$AAB" | grep -qE 'META-INF/.*\.(RSA|EC|DSA)'; then
            echo "AAB firmado correctamente."
          else
            echo "::error::El AAB NO esta firmado. Google Play lo rechazara."
            exit 1
          fi

      - name: Remove keystore from runner
        if: always()
        run: rm -f "$RUNNER_TEMP/nsk-release.jks"

      - name: Upload release AAB
        if: steps.signing.outputs.available == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: nsk-android-release-aab
          path: app/build/outputs/bundle/release/app-release.aab
          retention-days: 90

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: "NSK Android build #${{ github.run_number }}"
          body: |
            app-debug.apk: solo para pruebas internas (instalacion manual).
            app-release.aab: archivo para subir a Google Play (solo si la firma esta configurada).
          files: |
            app/build/outputs/apk/debug/app-debug.apk
            app/build/outputs/bundle/release/app-release.aab
          fail_on_unmatched_files: false
          make_latest: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
