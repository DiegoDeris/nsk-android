plugins {
    id 'com.android.application'
    id 'kotlin-android'
}

// ─────────────────────────────────────────────────────────────────────────────
// Firma de publicación
//
// Google Play no acepta compilaciones de depuración. Hace falta firmar con una
// clave que SOLO tú controlas: si se pierde, no se puede volver a publicar una
// actualización de esta app nunca más.
//
// La clave no vive en el repositorio. Se lee de dos sitios posibles:
//   - keystore.properties en la raíz del proyecto (para compilar en tu Mac)
//   - variables de entorno (para GitHub Actions)
//
// Si no hay ninguna de las dos, la compilación de release se hace sin firmar y
// avisa. Nunca falla en silencio.
// ─────────────────────────────────────────────────────────────────────────────
def keystorePropertiesFile = rootProject.file("keystore.properties")
def keystoreProperties = new Properties()
def hasKeystoreFile = keystorePropertiesFile.exists()
if (hasKeystoreFile) {
    keystoreProperties.load(new FileInputStream(keystorePropertiesFile))
}

def envStorePath = System.getenv("NSK_KEYSTORE_PATH")
def hasEnvKeystore = envStorePath != null && !envStorePath.isEmpty()
def canSign = hasKeystoreFile || hasEnvKeystore

android {
    namespace 'com.neuroshield.nsk'
    // Google Play exige API 36 para apps nuevas desde el 31/08/2026.
    compileSdk 36

    defaultConfig {
        applicationId 'com.neuroshield.nsk'
        minSdk 26
        targetSdk 36
        versionCode 1
        versionName '1.0'
    }

    if (canSign) {
        signingConfigs {
            release {
                if (hasKeystoreFile) {
                    storeFile file(keystoreProperties['storeFile'])
                    storePassword keystoreProperties['storePassword']
                    keyAlias keystoreProperties['keyAlias']
                    keyPassword keystoreProperties['keyPassword']
                } else {
                    storeFile file(envStorePath)
                    storePassword System.getenv("NSK_KEYSTORE_PASSWORD")
                    keyAlias System.getenv("NSK_KEY_ALIAS")
                    keyPassword System.getenv("NSK_KEY_PASSWORD")
                }
            }
        }
    }

    buildTypes {
        debug {
            minifyEnabled false
            applicationIdSuffix '.debug'
            versionNameSuffix '-debug'
        }
        release {
            // Ofuscación y reducción de código para la versión publicada.
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            if (canSign) {
                signingConfig signingConfigs.release
            } else {
                println "\n⚠️  NSK: compilando RELEASE SIN FIRMAR."
                println "    Google Play no aceptará este archivo."
                println "    Crea keystore.properties o define NSK_KEYSTORE_PATH.\n"
            }
        }
    }

    // El análisis estático de la compilación de publicación aborta por defecto
    // ante avisos que no bloquean el funcionamiento (por ejemplo, sobrescribir
    // un método añadido en una versión de Android más reciente que la mínima).
    // Se deja que la compilación termine, pero el informe se publica siempre
    // como artefacto y HAY QUE LEERLO antes de subir nada a Google Play.
    lint {
        abortOnError false
        checkReleaseBuilds true
        htmlReport true
        xmlReport true
        // Ruta fija y predecible. Por defecto el nombre del informe cambia
        // según la variante (lint-results-release.html, lint-vital-...), y la
        // compilación no lo encontraba: se descartaba en silencio y nos
        // quedábamos sin el informe que hay que revisar antes de publicar.
        htmlOutput = project.layout.buildDirectory.file("reports/lint-results-nsk.html").get().asFile
        xmlOutput = project.layout.buildDirectory.file("reports/lint-results-nsk.xml").get().asFile
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    kotlinOptions { jvmTarget = '17' }
    buildFeatures { viewBinding true }
}

// El paso de la compilación que recoge el informe de análisis se ejecuta justo
// después de `assembleDebug`, y en ese momento el análisis todavía no se ha
// ejecutado: por eso el informe no aparecía nunca y la instrucción de
// revisarlo antes de publicar era papel mojado.
//
// Encadenándolo aquí, el informe existe cuando se va a recoger. Cuesta menos
// de un minuto por compilación y evita publicar a ciegas.
afterEvaluate {
    tasks.named("assembleDebug").configure { finalizedBy("lint") }
}

dependencies {
    implementation 'androidx.core:core-ktx:1.12.0'
    implementation 'androidx.appcompat:appcompat:1.6.1'
    implementation 'androidx.activity:activity-ktx:1.8.2'
    implementation 'androidx.lifecycle:lifecycle-runtime-ktx:2.7.0'
    implementation 'androidx.work:work-runtime-ktx:2.9.0'
    implementation 'com.squareup.okhttp3:okhttp:4.12.0'
    implementation 'org.jetbrains.kotlinx:kotlinx-coroutines-android:1.7.3'
    implementation 'com.google.zxing:core:3.5.2'
    implementation 'com.journeyapps:zxing-android-embedded:4.3.0'
}
